openapi: 3.0.0
info:
  title: m015 s03 combined HTTP proof
  version: 1.0.0
paths:
  /users:
    post:
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - profile
              properties:
                email:
                  type: string
                profile:
                  type: object
                  additionalProperties: false
                  required:
                    - active
                    - age
                  properties:
                    active:
                      type: boolean
                    age:
                      type: integer
                      minimum: 0
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - created
                properties:
                  id:
                    type: string
                  created:
                    type: boolean
