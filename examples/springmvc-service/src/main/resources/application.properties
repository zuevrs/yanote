server.port=${EXAMPLE_SERVER_PORT:8080}
spring.main.banner-mode=off

yanote.recorder.enabled=true
yanote.recorder.service-name=${EXAMPLE_SERVICE_NAME:examples-service}
yanote.recorder.events-path=${YANOTE_EVENTS_PATH:/data/yanote/${yanote.recorder.service-name}-${server.port}.events.jsonl}

example.kafka.enabled=${EXAMPLE_KAFKA_ENABLED:false}
example.kafka.roles.producer.enabled=${EXAMPLE_KAFKA_PRODUCER_ENABLED:${example.kafka.enabled:false}}
example.kafka.roles.listeners.enabled=${EXAMPLE_KAFKA_LISTENERS_ENABLED:${example.kafka.enabled:false}}
example.kafka.roles.republish.enabled=${EXAMPLE_KAFKA_REPUBLISH_ENABLED:${example.kafka.enabled:false}}
example.kafka.roles.listeners.user-created.enabled=${EXAMPLE_KAFKA_USER_CREATED_LISTENER_ENABLED:${example.kafka.roles.listeners.enabled:false}}
example.kafka.roles.listeners.user-republished.enabled=${EXAMPLE_KAFKA_USER_REPUBLISHED_LISTENER_ENABLED:${example.kafka.roles.republish.enabled:false}}
example.kafka.topics.user-created=${EXAMPLE_KAFKA_TOPIC_USER_CREATED:users.created}
example.kafka.topics.user-republished=${EXAMPLE_KAFKA_TOPIC_USER_REPUBLISHED:users.created.republished}

spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=${EXAMPLE_KAFKA_GROUP_ID:${yanote.recorder.service-name}-group}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.retries=0
