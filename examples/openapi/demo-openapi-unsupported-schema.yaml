openapi: 3.0.0
info:
  title: yanote demo api
  version: 1.0.0
paths:
  /users:
    get:
      responses:
        '200':
          description: users list
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: user details
  /admin/ping:
    get:
      responses:
        '200':
          description: admin ping
components:
  schemas:
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
      properties:
        name:
          type: string
          pattern: "["
        email:
          type: string
          format: email
    CreateUserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - created
      properties:
        id:
          type: string
          pattern: "["
        name:
          type: string
        email:
          type: string
          format: email
        created:
          type: boolean
