asyncapi: 3.0.0
info:
  title: yanote async v3 kafka sample
  version: '1.0.0'
servers:
  kafkaLocal:
    host: localhost:9092
    protocol: kafka
channels:
  usersSignedUp:
    address: users.signedup
    messages:
      UserSignedUp:
        payload:
          type: object
  usersDeleted:
    address: users.deleted
    messages:
      UserDeleted:
        payload:
          type: object
operations:
  sendUserSignedUp:
    action: send
    channel:
      $ref: '#/channels/usersSignedUp'
    messages:
      - $ref: '#/channels/usersSignedUp/messages/UserSignedUp'
  receiveUserDeleted:
    action: receive
    channel:
      $ref: '#/channels/usersDeleted'
    messages:
      - $ref: '#/channels/usersDeleted/messages/UserDeleted'
