asyncapi: 3.0.0
info:
  title: spring kafka two-service invalid payload proof
  version: '1.0.0'
servers:
  kafkaLocal:
    host: localhost:9092
    protocol: kafka
channels:
  userCreated:
    address: users.created
    messages:
      UserCreated:
        payload:
          $ref: '#/components/schemas/UserCreatedPayload'
operations:
  sendUserCreated:
    action: send
    channel:
      $ref: '#/channels/userCreated'
    messages:
      - $ref: '#/channels/userCreated/messages/UserCreated'
  receiveUserCreated:
    action: receive
    channel:
      $ref: '#/channels/userCreated'
    messages:
      - $ref: '#/channels/userCreated/messages/UserCreated'
components:
  schemas:
    UserCreatedPayload:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
