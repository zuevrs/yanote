asyncapi: 3.0.0
info:
  title: spring kafka single-service republish proof
  version: '1.0.0'
servers:
  kafkaLocal:
    host: localhost:9092
    protocol: kafka
channels:
  userCreated:
    address: users.created
    messages:
      UserCreated:
        headers:
          $ref: '#/components/schemas/YanoteKafkaHeaders'
        payload:
          $ref: '#/components/schemas/UserCreatedPayload'
  userRepublished:
    address: users.created.republished
    messages:
      UserRepublished:
        headers:
          $ref: '#/components/schemas/YanoteKafkaHeaders'
        payload:
          $ref: '#/components/schemas/UserRepublishedPayload'
operations:
  sendUserCreated:
    action: send
    channel:
      $ref: '#/channels/userCreated'
    messages:
      - $ref: '#/channels/userCreated/messages/UserCreated'
  receiveUserCreated:
    action: receive
    channel:
      $ref: '#/channels/userCreated'
    messages:
      - $ref: '#/channels/userCreated/messages/UserCreated'
  sendUserRepublished:
    action: send
    channel:
      $ref: '#/channels/userRepublished'
    messages:
      - $ref: '#/channels/userRepublished/messages/UserRepublished'
  receiveUserRepublished:
    action: receive
    channel:
      $ref: '#/channels/userRepublished'
    messages:
      - $ref: '#/channels/userRepublished/messages/UserRepublished'
components:
  schemas:
    YanoteKafkaHeaders:
      type: object
      required:
        - yanote.message
        - yanote.test.run_id
        - yanote.test.suite
      properties:
        yanote.message:
          type: string
        yanote.test.run_id:
          type: string
        yanote.test.suite:
          type: string
    UserCreatedPayload:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
    UserRepublishedPayload:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
