asyncapi: 3.0.0
info:
  title: yanote trait declarations trait v3 sample
  version: '1.0.0'
servers:
  kafkaLocal:
    host: localhost:9092
    protocol: kafka
channels:
  orderCommands:
    address: orders.command
    messages:
      OrderCommand:
        name: OrderCommand
        traits:
          - $ref: '#/components/messageTraits/CorrelationTrait'
        contentType: application/json
        payload:
          type: object
operations:
  sendOrderCommand:
    action: send
    channel:
      $ref: '#/channels/orderCommands'
    reply:
      address:
        location: $message.header#/reply_to
    messages:
      - $ref: '#/channels/orderCommands/messages/OrderCommand'
components:
  messageTraits:
    CorrelationTrait:
      correlationId:
        location: $message.header#/correlation_id
