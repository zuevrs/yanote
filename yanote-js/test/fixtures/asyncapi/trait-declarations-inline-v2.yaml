asyncapi: 2.6.0
info:
  title: yanote trait declarations inline v2 sample
  version: '1.0.0'
servers:
  kafkaLocal:
    url: localhost:9092
    protocol: kafka
channels:
  orders.command:
    publish:
      operationId: sendOrderCommand
      message:
        messageId: OrderCommand
        correlationId:
          location: $message.header#/correlation_id
        contentType: application/json
        payload:
          type: object
