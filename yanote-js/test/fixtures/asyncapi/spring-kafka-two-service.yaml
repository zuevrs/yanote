asyncapi: 3.0.0
info:
  title: spring kafka two-service proof
  version: '1.0.0'
servers:
  kafkaLocal:
    host: localhost:9092
    protocol: kafka
channels:
  userCreated:
    address: users.created
    bindings:
      kafka:
        topic: users.created
    messages:
      UserCreated:
        name: UserCreated
        correlationId:
          location: $message.header#/correlation_id
        headers:
          $ref: '#/components/schemas/YanoteKafkaHeaders'
        payload:
          $ref: '#/components/schemas/UserCreatedPayload'
operations:
  sendUserCreated:
    action: send
    channel:
      $ref: '#/channels/userCreated'
    reply:
      channel:
        $ref: '#/channels/userCreated'
      address:
        location: $message.header#/reply_to
    messages:
      - $ref: '#/channels/userCreated/messages/UserCreated'
  receiveUserCreated:
    action: receive
    channel:
      $ref: '#/channels/userCreated'
    reply:
      channel:
        $ref: '#/channels/userCreated'
      address:
        location: $message.header#/reply_to
    messages:
      - $ref: '#/channels/userCreated/messages/UserCreated'
components:
  schemas:
    YanoteKafkaHeaders:
      type: object
      required:
        - yanote.message
        - yanote.test.run_id
        - yanote.test.suite
        - correlation_id
        - reply_to
      properties:
        yanote.message:
          type: string
        yanote.test.run_id:
          type: string
        yanote.test.suite:
          type: string
        correlation_id:
          type: string
        reply_to:
          type: string
    UserCreatedPayload:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
