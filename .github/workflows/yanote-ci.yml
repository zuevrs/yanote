name: yanote-ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:
    inputs:
      policy_path:
        description: Optional policy file path override
        required: false
        type: string
      min_coverage:
        description: Optional minimum operations coverage percent (0-100)
        required: false
        type: string
      min_aggregate:
        description: Optional minimum aggregate coverage percent (0-100)
        required: false
        type: string
      critical_operations:
        description: Optional comma-separated critical operation keys
        required: false
        type: string
      exclude_patterns:
        description: Optional comma-separated exclusion route patterns
        required: false
        type: string

permissions:
  contents: read

env:
  YANOTE_OUT_DIR: build/yanote/aggregate/check
  YANOTE_ARTIFACT_DIR: .yanote-ci/artifacts

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Assert Java 21 baseline
        run: bash scripts/ci/assert-java21.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run JVM tests
        run: ./gradlew test

      - name: Run analyzer tests
        run: npm -C yanote-js ci && npm -C yanote-js test

      - name: Run script and release contract suites
        run: node --test scripts/ci/*.test.mjs scripts/release/*.test.mjs

      - name: Determine delivery-sensitive proof scope
        id: detect-delivery-proof
        run: |
          set -euo pipefail
          mkdir -p .yanote-ci

          should_run=false
          reason="event_${GITHUB_EVENT_NAME}"

          case "${GITHUB_EVENT_NAME}" in
            merge_group)
              should_run=true
              reason="merge_group"
              ;;
            pull_request)
              base_sha="${{ github.event.pull_request.base.sha }}"
              changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")"
              printf '%s\n' "${changed_files}" > .yanote-ci/delivery-proof-changed-files.txt
              if printf '%s\n' "${changed_files}" | grep -Eq '^(examples/|scripts/ci/|yanote-recorder-spring-mvc/|yanote-recorder-spring-kafka/|yanote-gradle-plugin/)'; then
                should_run=true
                reason="path_match"
              else
                reason="no_sensitive_changes"
              fi
              ;;
          esac

          printf 'should_run=%s\nreason=%s\n' "${should_run}" "${reason}" > .yanote-ci/delivery-proof-scope.txt
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Run delivery-sensitive v1 e2e proof
        id: run-delivery-proof
        run: |
          mkdir -p .yanote-ci
          should_run="${{ steps.detect-delivery-proof.outputs.should_run }}"
          printf '%s\n' "${should_run}" > .yanote-ci/delivery-proof-should-run.txt

          if [[ "${should_run}" != "true" ]]; then
            printf '0\n' > .yanote-ci/delivery-proof-exit-code.txt
            echo "exit_code=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          set +e
          bash scripts/ci/run-v1-e2e.sh
          exit_code=$?
          set -e

          printf '%s\n' "${exit_code}" > .yanote-ci/delivery-proof-exit-code.txt
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run live Kafka proof stack
        id: run-live-kafka-proof
        run: |
          mkdir -p .yanote-ci
          set +e
          bash scripts/ci/verify-m004-s03-live-kafka-proof.sh
          exit_code=$?
          set -e
          printf '%s\n' "${exit_code}" > .yanote-ci/live-kafka-proof-exit-code.txt
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Collect build-and-test artifacts
        if: ${{ always() }}
        run: bash scripts/ci/collect-yanote-artifacts.sh "${YANOTE_ARTIFACT_DIR}"

      - name: Render async GitHub summary
        if: ${{ always() }}
        run: >
          node scripts/ci/render-yanote-summary.mjs
          --report "${YANOTE_ARTIFACT_DIR}/live-kafka-proof/yanote-async-report.json"
          --stdout "${YANOTE_ARTIFACT_DIR}/live-kafka-proof/async-report.stdout"
          --stderr "${YANOTE_ARTIFACT_DIR}/live-kafka-proof/async-report.stderr"
          --artifacts-dir "${YANOTE_ARTIFACT_DIR}/live-kafka-proof"
          --output "${GITHUB_STEP_SUMMARY}"
          --exit-code "${{ steps.run-live-kafka-proof.outputs.exit_code }}"

      - name: Upload build-and-test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-artifacts
          path: ${{ env.YANOTE_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce build-and-test proof results
        if: ${{ always() && (steps.run-live-kafka-proof.outputs.exit_code != '0' || steps.run-delivery-proof.outputs.exit_code != '0') }}
        run: |
          if [[ "${{ steps.run-delivery-proof.outputs.exit_code }}" != "0" ]]; then
            echo "Delivery-sensitive v1 e2e proof failed with exit code ${{ steps.run-delivery-proof.outputs.exit_code }} (reason=${{ steps.detect-delivery-proof.outputs.reason }})" >&2
          fi
          if [[ "${{ steps.run-live-kafka-proof.outputs.exit_code }}" != "0" ]]; then
            echo "Live Kafka proof failed with exit code ${{ steps.run-live-kafka-proof.outputs.exit_code }}" >&2
            exit "${{ steps.run-live-kafka-proof.outputs.exit_code }}"
          fi
          exit "${{ steps.run-delivery-proof.outputs.exit_code }}"

  yanote-validation:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Assert Java 21 baseline
        run: bash scripts/ci/assert-java21.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Yanote validation
        id: run-yanote
        env:
          INPUT_POLICY_PATH: ${{ github.event.inputs.policy_path }}
          INPUT_MIN_COVERAGE: ${{ github.event.inputs.min_coverage }}
          INPUT_MIN_AGGREGATE: ${{ github.event.inputs.min_aggregate }}
          INPUT_CRITICAL_OPERATIONS: ${{ github.event.inputs.critical_operations }}
          INPUT_EXCLUDE_PATTERNS: ${{ github.event.inputs.exclude_patterns }}
        run: bash scripts/ci/run-yanote-gradle-check.sh

      - name: Collect Yanote artifacts
        if: ${{ always() }}
        run: bash scripts/ci/collect-yanote-artifacts.sh "${YANOTE_ARTIFACT_DIR}"

      - name: Render Yanote GitHub summary
        if: ${{ always() }}
        run: >
          node scripts/ci/render-yanote-summary.mjs
          --report "${YANOTE_ARTIFACT_DIR}/yanote-report.json"
          --stderr "${YANOTE_ARTIFACT_DIR}/yanote-validation.stderr.log"
          --artifacts-dir "${YANOTE_ARTIFACT_DIR}"
          --output "${GITHUB_STEP_SUMMARY}"
          --exit-code "${{ steps.run-yanote.outputs.exit_code }}"

      - name: Upload Yanote artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yanote-validation-artifacts
          path: ${{ env.YANOTE_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Yanote validation result
        if: ${{ always() && steps.run-yanote.outputs.exit_code != '0' }}
        run: |
          echo "Yanote validation failed with exit code ${{ steps.run-yanote.outputs.exit_code }}" >&2
          exit "${{ steps.run-yanote.outputs.exit_code }}"

  v1-e2e:
    runs-on: ubuntu-latest
    needs: yanote-validation
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run full v1 e2e workflow
        run: bash scripts/ci/run-v1-e2e.sh
